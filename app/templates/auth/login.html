{% extends "base.html" %}
{% block title %}登录 — {{ site_name }}{% endblock %}
{% block content %}
<div class="container" style="max-width:420px">
  <div class="panel form-panel" style="margin:40px auto">
    <h2>⚔ 登录 1914</h2>
    <form method="post" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:14px">
        <label>用户名或邮箱</label>
        <input type="text" name="username" required autofocus autocomplete="username"
               value="{{ username or '' }}">
      </div>
      <div style="margin-bottom:18px">
        <label>密码</label>
        <input type="password" name="password" required autocomplete="current-password"
               value="{{ password or '' }}">
      </div>
      <button class="btn btn-brass" type="submit" style="width:100%">登录</button>
    </form>
    <p style="color:var(--muted);font-size:.9rem;margin-top:16px;text-align:center">
      <a href="/recover">忘记密码？恢复账户</a><br>
      还没有账号？<a href="/register">立即注册</a>
    </p>
  </div>
</div>
{% endblock %}
