{% extends "base.html" %}
{% block title %}注册 — {{ site_name }}{% endblock %}
{% block content %}
<div class="container" style="max-width:460px">
  <div class="panel form-panel" style="margin:40px auto">
    <h2>✠ 加入 1914</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-top:0">注册后即可投稿卡牌、提交 Bug、参与评论和投票。</p>
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:14px">
        <label>用户名 *（2–20 字符，中文/字母/数字/下划线）</label>
        <input type="text" name="username" required autofocus minlength="2" maxlength="20"
               autocomplete="username" value="{{ request.form.get('username', '') }}">
      </div>
      <div style="margin-bottom:14px">
        <label>密码 *（至少 8 位，须包含字母和数字）</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div style="margin-bottom:14px">
        <label>确认密码 *</label>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <hr style="border:none;border-top:1px solid var(--line-soft);margin:18px 0">
      <p style="color:var(--muted);font-size:.85rem;margin:0 0 12px">
        以下为<b>账户恢复方式</b>，都可以留空；建议至少填写一种，忘记密码时才能找回账户。</p>
      <div style="margin-bottom:14px">
        <label>邮箱（可选，用于账户恢复）</label>
        <input type="email" name="email" autocomplete="email"
               value="{{ request.form.get('email', '') }}">
      </div>
      <div style="margin-bottom:14px">
        <label>安全问题（可选，用于账户恢复）
          <span class="q-help" tabindex="0">?
            <span class="q-tooltip">安全问题用于在忘记密码时恢复账户。如果你没有填写邮箱，也可以通过正确回答安全问题来恢复账户。建议填写自己容易记住、但其他人不容易猜到的问题和答案。</span>
          </span>
        </label>
        <input type="text" name="security_question" maxlength="200"
               placeholder="例如：我的小学在哪里？"
               value="{{ request.form.get('security_question', '') }}">
      </div>
      <div style="margin-bottom:18px">
        <label>安全问题答案（可选，用于账户恢复）</label>
        <input type="text" name="security_answer" maxlength="200" autocomplete="off"
               placeholder="答案不区分大小写"
               value="{{ request.form.get('security_answer', '') }}">
      </div>
      <button class="btn btn-brass" type="submit" style="width:100%">注册</button>
    </form>
    <p style="color:var(--muted);font-size:.9rem;margin-top:16px;text-align:center">
      已有账号？<a href="/login">直接登录</a>
    </p>
  </div>
</div>
{% endblock %}
