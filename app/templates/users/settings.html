{% extends "base.html" %}
{% block title %}个人设置 — {{ site_name }}{% endblock %}
{% block content %}
<div class="container" style="max-width:640px">
  <div class="page-title"><h1>个人设置</h1></div>

  <div class="panel">
    <h2>公开资料</h2>
    <form method="post" action="/settings">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:14px">
        <label>用户名（不可修改）</label>
        <input type="text" value="{{ profile_user['username'] }}" disabled>
      </div>
      <div style="margin-bottom:14px">
        <label>邮箱（选填，可用于登录，不公开展示）</label>
        <input type="email" name="email" value="{{ profile_user['email'] or '' }}">
      </div>
      <div style="margin-bottom:14px">
        <label>个人简介（公开展示，最多 200 字）</label>
        <textarea name="bio" maxlength="200" style="min-height:80px">{{ profile_user['bio'] }}</textarea>
      </div>
      <button class="btn btn-brass" type="submit">保存资料</button>
    </form>
  </div>

  <div class="panel">
    <h2>修改密码</h2>
    <form method="post" action="/settings/password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:14px">
        <label>当前密码</label>
        <input type="password" name="old_password" required autocomplete="current-password">
      </div>
      <div style="margin-bottom:14px">
        <label>新密码（至少 8 位，含字母和数字）</label>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
      </div>
      <div style="margin-bottom:14px">
        <label>确认新密码</label>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit">修改密码</button>
    </form>
  </div>
</div>
{% endblock %}
